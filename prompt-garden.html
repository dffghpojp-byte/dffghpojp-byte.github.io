<html lang="ja">

<meta name="description" content="お気に入りのプロンプトを保存、整理、編集できるライブラリ"><title>Prompt Garden — プロンプト保管庫</title>
<style>
:root{--ink:#302b43;--muted:#817c94;--line:#e9e4f1;--white:rgba(255,255,255,.86);--purple:#8069d8;--pink:#ee93b6;--shadow:0 16px 45px rgba(86,68,125,.1)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(ellipse at 8% 5%,#e8e5ff 0,transparent 35%),radial-gradient(ellipse at 95% 18%,#ffe4ed 0,transparent 32%),radial-gradient(ellipse at 50% 100%,#e3f5f0 0,transparent 42%),#f8f7fc}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;padding:32px 38px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;color:white;font-size:23px;background:linear-gradient(135deg,#a991f0,#f1a7c7);box-shadow:0 8px 20px #b49bdf55}.brand h1{font-size:22px;line-height:1.25;margin:0;letter-spacing:.02em}.brand p{color:var(--muted);margin:4px 0 0;font-size:13px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff9;border-radius:12px;padding:10px 15px;color:var(--ink);font-weight:700;transition:.16s}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #45365b16}.btn.primary{color:white;border:0;background:linear-gradient(120deg,#9279e5,#db8db8);box-shadow:0 7px 18px #a888d540}.btn.soft{background:#f4efff;color:#6f5bbd;border-color:#eee8ff}.btn.danger{color:#cf6580}.welcome{padding:27px 30px;border:1px solid #fff;border-radius:22px;background:linear-gradient(110deg,#fff9 0%,#f7f0ffdf 48%,#fff0f6dc 100%);box-shadow:var(--shadow);margin-bottom:23px;display:flex;align-items:center;justify-content:space-between;gap:20px}.welcome h2{font-size:20px;margin:0 0 5px}.welcome p{margin:0;color:var(--muted)}.count-pill{white-space:nowrap;background:#fff9;border:1px solid #fff;border-radius:999px;padding:9px 15px;color:#7162b1;font-weight:750}.layout{display:grid;grid-template-columns:minmax(315px,.86fr) minmax(460px,1.4fr);gap:22px;align-items:start}.panel{border:1px solid #fff;background:var(--white);border-radius:21px;box-shadow:var(--shadow);backdrop-filter:blur(12px);overflow:hidden}.library{min-height:520px}.panel-head{padding:21px 22px 14px}.panel-head h2{font-size:16px;margin:0 0 13px}.search{position:relative}.search input{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 14px 11px 39px;outline:none;color:var(--ink)}.search:before{content:'⌕';position:absolute;left:14px;top:6px;color:#a29ab5;font-size:23px}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#ad98e9;box-shadow:0 0 0 3px #bba9ef30;outline:none}.filters{display:flex;gap:7px;padding:0 22px 13px;overflow:auto}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff9;color:var(--muted);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700}.chip.active{background:#eee9ff;color:#725fbd;border-color:#e3dbff}.prompt-list{padding:2px 12px 15px;display:grid;gap:7px;max-height:510px;overflow:auto}.prompt-card{position:relative;text-align:left;width:100%;border:1px solid transparent;border-radius:15px;background:transparent;padding:13px 14px;color:inherit;transition:.15s}.prompt-card:hover{background:#fff9}.prompt-card.selected{background:linear-gradient(110deg,#f0ecff,#fff1f6);border-color:#e8dcfa}.card-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.card-title{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tag{font-size:11px;background:#f1edff;color:#7b69c1;border-radius:999px;padding:3px 9px;flex:none}.card-desc{margin-top:5px;font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{padding:40px 20px;text-align:center;color:var(--muted)}.editor{padding:24px 26px 22px}.editor-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:21px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#9988ce;font-weight:800}.editor-head h2{margin:3px 0 0;font-size:19px}.editor-actions{display:flex;gap:7px}.icon-btn{border:1px solid var(--line);background:white;border-radius:10px;width:38px;height:38px;color:var(--muted);font-size:16px}.icon-btn:hover{color:#6f5bbd;background:#f8f5ff}.field{margin-bottom:15px}.field label{display:block;font-weight:750;font-size:12px;color:#716c83;margin-bottom:6px}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 13px;color:var(--ink);transition:.15s}.field textarea{min-height:315px;resize:vertical;line-height:1.8}.field input::placeholder,.field textarea::placeholder{color:#b4afc0}.editor-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}.save-status{color:#9690a5;font-size:12px}.editor-buttons{display:flex;gap:8px}.btn.copy{background:#f3eefc;color:#6c59b2;border-color:#e9e0fa}.snippets-view{margin-top:8px;padding-bottom:18px}.snippet-list{display:grid;gap:10px;padding:18px 22px 8px}.snippet-item{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;padding:14px 92px 14px 15px}.snippet-item pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)}.snippet-copy{position:absolute;right:46px;top:11px;border:1px solid var(--line);background:#f4efff;color:#6f5bbd;border-radius:9px;padding:5px 8px;font-size:12px;font-weight:700}.snippet-remove{position:absolute;right:12px;top:8px;border:0;background:transparent;color:#bcb6ab;font-size:22px;line-height:1}.snippet-remove:hover{color:#cf6580}.snippet-add{display:flex;gap:10px;padding:10px 22px 0;align-items:stretch}.snippet-add textarea{flex:1;min-height:55px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink)}.snippet-add .btn{min-width:88px}.top-actions #showSnippets.active,.top-actions #showPrompts.active{background:#eee9ff;color:#725fbd;border-color:#e3dbff}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;background:#39334c;color:white;padding:11px 17px;border-radius:12px;box-shadow:var(--shadow);transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.app{padding:22px 18px 35px}.layout{grid-template-columns:1fr}.prompt-list{max-height:350px}.welcome{align-items:flex-start}.editor{padding:21px}.field textarea{min-height:260px}}@media(max-width:520px){.app{padding:16px 12px 28px}.top{align-items:flex-start;margin-bottom:20px}.brand{gap:10px}.logo{width:42px;height:42px;border-radius:14px}.brand h1{font-size:18px}.brand p{font-size:11px}.top-actions .btn{padding:8px 10px;font-size:12px}.welcome{padding:20px;border-radius:18px}.welcome h2{font-size:17px}.welcome p{font-size:13px}.count-pill{font-size:12px;padding:7px 10px}.editor-head{align-items:center}.editor-head h2{font-size:17px}.editor{padding:18px}.editor-foot{align-items:flex-start;flex-direction:column}.editor-buttons{width:100%}.editor-buttons .btn{flex:1}}
/* 水色のパステルグラデーション */
body{background:radial-gradient(ellipse at 7% 4%,#dcefff 0,transparent 36%),radial-gradient(ellipse at 96% 16%,#d9f8ff 0,transparent 34%),radial-gradient(ellipse at 50% 100%,#e3f8f5 0,transparent 43%),#f7fbff}
.logo{background:linear-gradient(135deg,#78bee9,#a9dff3);box-shadow:0 8px 20px #84cbea66}
.btn.primary{background:linear-gradient(120deg,#54a8de,#8bd5e7);box-shadow:0 7px 18px #6ab8df55}
.btn.soft{background:#eaf8ff;color:#397da9;border-color:#d8effb}
.welcome{background:linear-gradient(110deg,#ffffffdd 0%,#edf9ffdf 48%,#e5f8fbdf 100%)}
.count-pill{color:#397da9}.chip.active,.top-actions #showSnippets.active,.top-actions #showPrompts.active{background:#e2f4ff;color:#377ba8;border-color:#cde9fa}
.prompt-card.selected{background:linear-gradient(110deg,#e8f7ff,#e9faf9);border-color:#cfeafb}.tag{background:#e7f6ff;color:#3f83ae}.eyebrow{color:#599ac2}
.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:#82c7e9;box-shadow:0 0 0 3px #93d4ef42}.icon-btn:hover{color:#387da8;background:#edf9ff}.btn.copy,.snippet-copy{background:#e9f7ff;color:#397da9;border-color:#d4ecfa}
.link-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px;padding:18px 22px 8px}.link-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:15px;min-width:0}.link-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.link-card h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.link-url{display:block;margin:6px 0 14px;color:#6196b6;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.link-actions{display:flex;gap:7px}.link-open,.link-edit{border:1px solid #d4ecfa;background:#edf9ff;color:#397da9;border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px;text-decoration:none}.link-edit{background:#fff;color:var(--muted);border-color:var(--line)}.link-remove{border:0;background:transparent;color:#bcb6ab;font-size:21px;line-height:1}.link-remove:hover{color:#cf6580}.link-form{display:grid;grid-template-columns:1fr 1.5fr auto;gap:10px;padding:14px 22px 4px}.link-form input{min-width:0;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px 13px;color:var(--ink)}.link-form input:focus{border-color:#82c7e9;box-shadow:0 0 0 3px #93d4ef42;outline:none}.link-form .btn{min-width:82px}@media(max-width:650px){.link-form{grid-template-columns:1fr}.link-form .btn{min-height:46px}}
.top-actions #showLinks.active{background:#e2f4ff;color:#377ba8;border-color:#cde9fa}
</style></head>
<body><main class="app">
<header class="top"><div class="brand"><div class="logo">✳</div><div><h1>Prompt Garden</h1><p>あなたのアイデアを、いつでも使えるかたちに。</p></div></div><div class="top-actions"><button class="btn soft" id="cloudLogin">Googleで同期</button><button class="btn" id="showPrompts">プロンプト</button><button class="btn" id="showSnippets">📝 定型文</button><button class="btn" id="showLinks">🔗 リンク集</button><button class="btn primary" id="newBtn">＋ 新しいプロンプト</button></div></header>
<section class="welcome"><div><h2>プロンプトを、心地よく整理しよう。</h2><p>よく使う指示文を保存して、必要なときにすぐ呼び出せます。</p></div><div class="count-pill" id="totalCount">0 prompts</div></section>
<div id="promptView"><div class="layout"><section class="panel library"><div class="panel-head"><h2>マイライブラリ</h2><div class="search"><input id="searchInput" type="search" placeholder="タイトル・内容から検索" aria-label="プロンプト検索"></div></div><div class="filters" id="filters"></div><div class="prompt-list" id="promptList"></div></section>
<section class="panel editor"><div class="editor-head"><div><div class="eyebrow" id="editorEyebrow">PROMPT EDITOR</div><h2 id="editorTitle">プロンプトを選ぶか、新しく作成</h2></div><div class="editor-actions"><button class="icon-btn" id="duplicateBtn" title="複製" aria-label="複製">▢</button><button class="icon-btn" id="deleteBtn" title="削除" aria-label="削除">⌫</button></div></div>
<div class="field"><label for="titleInput">タイトル</label><input id="titleInput" placeholder="例：Instagram投稿の文章を作る"></div><div class="field"><label for="categoryInput">カテゴリー</label><input id="categoryInput" list="categories" placeholder="カテゴリーを入力（例：SNS）"><datalist id="categories"></datalist></div><div class="field"><label for="contentInput">プロンプト本文</label><textarea id="contentInput" placeholder="ここにプロンプトを書きます…"></textarea></div>
<div class="editor-foot"><span class="save-status" id="saveStatus">このブラウザに自動保存されます</span><div class="editor-buttons"><button class="btn copy" id="copyBtn">本文をコピー</button><button class="btn primary" id="saveBtn">保存する</button></div></div></section></div></div><section class="panel snippets-view" id="snippetView" hidden><div class="panel-head"><h2>📝 定型文</h2><p style="margin:0;color:var(--muted)">よく使う文を登録して、クリックですぐコピーできます。</p></div><div class="snippet-list" id="snippetList"></div><div class="snippet-add"><textarea id="snippetInput" placeholder="新しい定型文を入力..."></textarea><button class="btn primary" id="addSnippet">追加</button></div></section><section class="panel snippets-view" id="linkView" hidden><div class="panel-head"><h2>🔗 リンク集</h2><p style="margin:0;color:var(--muted)">よく使うページやスプレッドシートを登録して、ワンタッチで開けます。</p></div><div class="link-list" id="linkList"></div><div class="link-form"><input id="linkTitle" placeholder="名前（例：楽天ROOM）"><input id="linkUrl" type="url" placeholder="URLを貼り付け（GoogleスプレッドシートもOK）"><button class="btn primary" id="saveLink">追加</button></div></section></main><div class="toast" id="toast" role="status"></div>
<script>
const KEY='prompt-garden-v1';
const starter=[{id:'welcome-1',title:'SNS投稿のアイデア出し',category:'SNS',content:'あなたはSNS運用のプロです。\n以下のテーマについて、ターゲットに響く投稿アイデアを5つ提案してください。\n\nテーマ：［ここに入力］\nターゲット：［ここに入力］\nトーン：親しみやすく、具体的に'},{id:'welcome-2',title:'文章をやさしく整える',category:'ライティング',content:'次の文章を、意味を変えずに読みやすく整えてください。\n専門用語はできるだけ避け、自然でやさしい表現にします。\n\n文章：\n［ここに文章を貼り付け］\n\n出力は修正後の文章のみ。'},{id:'welcome-3',title:'新しい企画を考える',category:'アイデア',content:'あなたは経験豊富な企画担当者です。\n次の条件に合う企画案を3つ考えてください。\n\n目的：［ここに入力］\n対象：［ここに入力］\n使える予算・時間：［ここに入力］\n\n各案に、企画の概要・期待できる効果・最初の一歩を含めてください。'}];
let items=load(),selectedId=null,activeCategory='すべて',dirty=false;const $=s=>document.querySelector(s),list=$('#promptList');
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:starter.map(x=>({...x}))}catch{return starter.map(x=>({...x}))}}function persist(){localStorage.setItem(KEY,JSON.stringify(items));$('#saveStatus').textContent='保存済み · '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const cats=[...new Set(items.map(x=>x.category).filter(Boolean))].sort();if(activeCategory!=='すべて'&&!cats.includes(activeCategory))activeCategory='すべて';$('#filters').innerHTML=['すべて',...cats].map(c=>`<button class="chip ${activeCategory===c?'active':''}" data-category="${esc(c)}">${esc(c)}${c==='すべて'?` · ${items.length}`:''}</button>`).join('');$('#filters').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{activeCategory=b.dataset.category;render()});$('#categories').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');$('#totalCount').textContent=`${items.length} ${items.length===1?'prompt':'prompts'}`;const q=$('#searchInput').value.trim().toLowerCase(),shown=items.filter(x=>(activeCategory==='すべて'||x.category===activeCategory)&&(!q||`${x.title} ${x.content} ${x.category}`.toLowerCase().includes(q)));list.innerHTML=shown.length?shown.map(x=>`<button class="prompt-card ${x.id===selectedId?'selected':''}" data-id="${esc(x.id)}"><div class="card-top"><span class="card-title">${esc(x.title||'無題')}</span>${x.category?`<span class="tag">${esc(x.category)}</span>`:''}</div><div class="card-desc">${esc(x.content||'本文はまだありません')}</div></button>`).join(''):'<div class="empty">'+(items.length?'見つかりませんでした':'まだプロンプトがありません。<br>右上から追加してみましょう。')+'</div>';list.querySelectorAll('.prompt-card').forEach(b=>b.onclick=()=>select(b.dataset.id));}
function select(id){selectedId=id;const x=items.find(p=>p.id===id);if(!x)return;$('#titleInput').value=x.title;$('#categoryInput').value=x.category||'';$('#contentInput').value=x.content;$('#editorTitle').textContent=x.title||'無題のプロンプト';$('#editorEyebrow').textContent='SAVED PROMPT';$('#saveStatus').textContent='このブラウザに自動保存されます';dirty=false;render()}
function blank(){selectedId=null;$('#titleInput').value='';$('#categoryInput').value='';$('#contentInput').value='';$('#editorTitle').textContent='新しいプロンプト';$('#editorEyebrow').textContent='NEW PROMPT';$('#saveStatus').textContent='内容を入力して保存してください';dirty=false;render();$('#titleInput').focus()}
function save(){const title=$('#titleInput').value.trim(),content=$('#contentInput').value.trim();if(!title){$('#titleInput').focus();return toast('タイトルを入力してください')}if(!content){$('#contentInput').focus();return toast('プロンプト本文を入力してください')}const data={title,category:$('#categoryInput').value.trim()||'未分類',content,updatedAt:new Date().toISOString()};if(selectedId){const i=items.findIndex(x=>x.id===selectedId);if(i>=0)items[i]={...items[i],...data};else{selectedId=crypto.randomUUID();items.unshift({id:selectedId,...data})}}else{selectedId=crypto.randomUUID();items.unshift({id:selectedId,...data})}persist();$('#editorTitle').textContent=title;$('#editorEyebrow').textContent='SAVED PROMPT';dirty=false;render();toast('プロンプトを保存しました')}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),1900)}
$('#newBtn').onclick=blank;$('#saveBtn').onclick=save;$('#searchInput').oninput=render;$('#titleInput').oninput=()=>{dirty=true;$('#editorTitle').textContent=$('#titleInput').value||'新しいプロンプト'};$('#categoryInput').oninput=()=>dirty=true;$('#contentInput').oninput=()=>dirty=true;
$('#deleteBtn').onclick=()=>{if(!selectedId)return toast('削除するプロンプトを選んでください');const x=items.find(p=>p.id===selectedId);if(!confirm(`「${x?.title||'無題'}」を削除しますか？`))return;items=items.filter(p=>p.id!==selectedId);selectedId=null;persist();blank();toast('削除しました')};$('#duplicateBtn').onclick=()=>{if(!selectedId)return toast('複製するプロンプトを選んでください');const x=items.find(p=>p.id===selectedId);selectedId=null;$('#titleInput').value=(x.title||'プロンプト')+'（コピー）';$('#categoryInput').value=x.category||'';$('#contentInput').value=x.content;$('#editorTitle').textContent=$('#titleInput').value;$('#editorEyebrow').textContent='DUPLICATE';dirty=true;toast('複製を編集して保存できます')};
$('#copyBtn').onclick=async()=>{const t=$('#contentInput').value;if(!t)return toast('コピーする本文がありません');try{await navigator.clipboard.writeText(t)}catch{$('#contentInput').select();document.execCommand('copy')}toast('本文をコピーしました')};
render();if(items.length)select(items[0].id);else blank();
const SNIP_KEY='prompt-garden-snippets-v1';let snippets=[];try{snippets=JSON.parse(localStorage.getItem(SNIP_KEY))||[]}catch{}if(!snippets.length){snippets=['お疲れ様です。','お手数おかけしますが、スプレッドシートのリサーチ作業の追加をお願いできますでしょうか。','追記ありがとうございました。','来月のスケジュールを共有します。\nよろしくお願いします。','ご対応ありがとうございます。'];localStorage.setItem(SNIP_KEY,JSON.stringify(snippets))}function drawSnippets(){const root=$('#snippetList');root.innerHTML=snippets.length?snippets.map((x,i)=>`<article class="snippet-item" data-i="${i}" ><pre><code>${esc(x)}</code></pre><button class="snippet-copy" aria-label="コピー">コピー</button><button class="snippet-remove" aria-label="削除">×</button></article>`).join(''):'<div class="empty">定型文はまだありません。下の欄から追加できます。</div>';root.querySelectorAll('.snippet-item').forEach(el=>{el.querySelector('.snippet-copy').onclick=async()=>{const value=snippets[+el.dataset.i];try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('定型文をコピーしました')};el.querySelector('.snippet-remove').onclick=e=>{e.stopPropagation();snippets.splice(+el.dataset.i,1);localStorage.setItem(SNIP_KEY,JSON.stringify(snippets));drawSnippets();toast('定型文を削除しました')}})}$('#addSnippet').onclick=()=>{const v=$('#snippetInput').value.trim();if(!v)return toast('定型文を入力してください');snippets.push(v);localStorage.setItem(SNIP_KEY,JSON.stringify(snippets));$('#snippetInput').value='';drawSnippets();toast('定型文を追加しました')};$('#showSnippets').onclick=()=>{$('#promptView').hidden=true;$('#snippetView').hidden=false;$('#showSnippets').classList.add('active');$('#showPrompts').classList.remove('active');$('#newBtn').hidden=true;drawSnippets()};$('#showPrompts').onclick=()=>{$('#snippetView').hidden=true;$('#promptView').hidden=false;$('#showPrompts').classList.add('active');$('#showSnippets').classList.remove('active');$('#newBtn').hidden=false};drawSnippets();
const LINK_KEY='prompt-garden-links-v1';const savedLinks=localStorage.getItem(LINK_KEY);let links=[];let editingLinkId=null;
try{links=JSON.parse(savedLinks)||[]}catch{}
if(savedLinks===null){links=[{id:'link-room',title:'楽天ROOM',url:'https://room.rakuten.co.jp/'},{id:'link-threads',title:'Threads',url:'https://www.threads.com/'},{id:'link-chatgpt',title:'ChatGPT',url:'https://chatgpt.com/'}];localStorage.setItem(LINK_KEY,JSON.stringify(links))}
function drawLinks(){const root=$('#linkList');root.innerHTML=links.length?links.map(x=>`<article class="link-card" data-id="${esc(x.id)}"><div class="link-card-head"><h3>${esc(x.title)}</h3><button class="link-remove" aria-label="削除">×</button></div><span class="link-url">${esc(x.url)}</span><div class="link-actions"><a class="link-open" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">開く ↗</a><button class="link-edit">編集</button></div></article>`).join(''):'<div class="empty">リンクはまだありません。下の欄から追加できます。</div>';root.querySelectorAll('.link-card').forEach(el=>{const link=links.find(x=>x.id===el.dataset.id);el.querySelector('.link-remove').onclick=()=>{links=links.filter(x=>x.id!==link.id);localStorage.setItem(LINK_KEY,JSON.stringify(links));if(editingLinkId===link.id)clearLinkForm();drawLinks();toast('リンクを削除しました')};el.querySelector('.link-edit').onclick=()=>{editingLinkId=link.id;$('#linkTitle').value=link.title;$('#linkUrl').value=link.url;$('#saveLink').textContent='更新';$('#linkTitle').focus()}})}
function clearLinkForm(){editingLinkId=null;$('#linkTitle').value='';$('#linkUrl').value='';$('#saveLink').textContent='追加'}
$('#saveLink').onclick=()=>{const title=$('#linkTitle').value.trim(),url=$('#linkUrl').value.trim();if(!title)return toast('リンク名を入力してください');if(!/^https?:\/\//i.test(url))return toast('https:// から始まるURLを貼り付けてください');const wasEditing=!!editingLinkId;if(editingLinkId){const i=links.findIndex(x=>x.id===editingLinkId);if(i>=0)links[i]={...links[i],title,url}}else links.unshift({id:crypto.randomUUID(),title,url});localStorage.setItem(LINK_KEY,JSON.stringify(links));clearLinkForm();drawLinks();toast(wasEditing?'リンクを更新しました':'リンクを追加しました')};
function switchView(view){const prompt=view==='prompt',snippet=view==='snippet',link=view==='link';$('#promptView').hidden=!prompt;$('#snippetView').hidden=!snippet;$('#linkView').hidden=!link;$('#showPrompts').classList.toggle('active',prompt);$('#showSnippets').classList.toggle('active',snippet);$('#showLinks').classList.toggle('active',link);$('#newBtn').hidden=!prompt;if(snippet)drawSnippets();if(link)drawLinks()}
$('#showPrompts').onclick=()=>switchView('prompt');$('#showSnippets').onclick=()=>switchView('snippet');$('#showLinks').onclick=()=>switchView('link');drawLinks();
</script>
